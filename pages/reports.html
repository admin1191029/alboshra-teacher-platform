<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقارير — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.report-card { background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:18px; }
.report-card h3 { font-size:1rem;font-weight:900;color:var(--ink2);margin-bottom:16px; }
.stu-report-row { display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border); }
.stu-report-row:last-child { border-bottom:none; }
.progress-bar { flex:1;height:8px;background:var(--surface);border-radius:99px;overflow:hidden; }
.progress-fill { height:100%;border-radius:99px;transition:width 0.4s; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>

<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>

<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'reports';

initApp({
  sections: ['students','attendance','grades','behavior','goals'],
  onReady: renderReports
});

function renderReports() {
  const A = window.APP;
  const students = A.students;
  const attKeys  = Object.keys(A.attendance).filter(k=>!k.includes('_notes'));
  const totalDays = attKeys.length;

  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">📊 التقارير</span></div>
    <div class="ph">
      <div><div class="ph-title">📊 التقارير والإحصاءات</div>
           <div class="ph-sub">${students.length} طالب · ${totalDays} يوم مسجّل</div></div>
      <div class="ph-actions">
        <button class="btn btn-ghost" onclick="printReport()">🖨️ طباعة</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi blue"><span class="kpi-icon">👥</span><div class="kpi-val">${students.length}</div><div class="kpi-label">الطلاب</div></div>
      <div class="kpi green"><span class="kpi-icon">📅</span><div class="kpi-val">${totalDays}</div><div class="kpi-label">أيام مسجّلة</div></div>
      <div class="kpi gold"><span class="kpi-icon">📒</span><div class="kpi-val">${A.grades.columns?.length||0}</div><div class="kpi-label">اختبارات</div></div>
      <div class="kpi plum"><span class="kpi-icon">⭐</span><div class="kpi-val">${Object.values(A.behavior).flat().length}</div><div class="kpi-label">سجلات سلوك</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
      <!-- نسبة حضور الطلاب -->
      <div class="report-card" style="grid-column:1/-1;">
        <h3>📋 نسب الحضور لكل طالب</h3>
        ${students.length===0
          ? '<div class="empty-state" style="padding:30px 0;"><div class="es-icon">📋</div><div class="es-title">لا يوجد بيانات</div></div>'
          : students.map(s=>{
              const days = attKeys.filter(k=>A.attendance[k]?.[s.id]);
              const present = attKeys.filter(k=>A.attendance[k]?.[s.id]==='present').length;
              const pct = totalDays ? Math.round(present/totalDays*100) : 0;
              const color = pct>=90?'#10b981':pct>=75?'#f59e0b':'#ef4444';
              return `
                <div class="stu-report-row">
                  <div style="width:130px;font-size:0.86rem;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name)}</div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%;background:${color};"></div>
                  </div>
                  <span style="font-size:0.84rem;font-weight:900;color:${color};min-width:42px;text-align:left;">${pct}%</span>
                  <span style="font-size:0.78rem;color:var(--muted);min-width:70px;">${present}/${totalDays} يوم</span>
                </div>`;
            }).join('')
        }
      </div>

      <!-- رسم حضور أسبوعي -->
      <div class="report-card">
        <h3>📈 الحضور — آخر 14 يوم</h3>
        <div class="chart-wrap"><canvas id="attLineChart"></canvas></div>
      </div>

      <!-- توزيع السلوك -->
      <div class="report-card">
        <h3>⭐ توزيع السلوك</h3>
        <div class="chart-wrap"><canvas id="behPieChart"></canvas></div>
      </div>

      <!-- أعلى درجات -->
      <div class="report-card" style="grid-column:1/-1;">
        <h3>🏆 ترتيب الطلاب حسب الدرجات</h3>
        ${buildGradeRank()}
      </div>
    </div>
  `;

  drawCharts();
}

function buildGradeRank() {
  const A = window.APP;
  const { columns, rows } = A.grades;
  if (!columns?.length || !A.students.length) return '<div style="color:var(--muted);padding:12px;text-align:center;">لا توجد درجات مسجّلة بعد</div>';
  const maxTotal = columns.reduce((a,c)=>a+(c.max||100),0);
  const ranked = [...A.students].map(s=>{
    const total = columns.reduce((a,c)=>a+(parseFloat(rows?.[s.id]?.[c.id])||0),0);
    return { name:s.name, total, pct: maxTotal ? Math.round(total/maxTotal*100) : 0 };
  }).sort((a,b)=>b.total-a.total);

  return ranked.map((s,i)=>`
    <div class="stu-report-row">
      <span style="font-weight:900;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#cd7c3e':'var(--muted)'};min-width:24px;">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</span>
      <div style="width:140px;font-size:0.88rem;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name)}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${s.pct}%;background:${s.pct>=75?'#10b981':s.pct>=50?'#f59e0b':'#ef4444'};"></div>
      </div>
      <span style="font-size:0.86rem;font-weight:900;min-width:48px;color:${s.pct>=75?'var(--mint)':s.pct>=50?'var(--gold)':'var(--ember)'};">${s.pct}%</span>
      <span style="font-size:0.78rem;color:var(--muted);">${s.total}/${maxTotal}</span>
    </div>`).join('');
}

function drawCharts() {
  const A = window.APP;
  // خط الحضور
  const days=[],present=[],absent=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.toISOString().split('T')[0];
    const att=A.attendance[k]||{};
    days.push(d.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric'}));
    present.push(Object.values(att).filter(v=>v==='present').length);
    absent.push(Object.values(att).filter(v=>v==='absent').length);
  }
  const attCtx=document.getElementById('attLineChart');
  if(attCtx) new Chart(attCtx,{
    type:'line',
    data:{labels:days,datasets:[
      {label:'حاضر',data:present,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.12)',fill:true,tension:0.4},
      {label:'غائب',data:absent, borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.12)', fill:true,tension:0.4},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:'Tajawal'}}}},scales:{x:{ticks:{font:{family:'Tajawal'},maxRotation:45}},y:{ticks:{font:{family:'Tajawal'},stepSize:1},beginAtZero:true}}}
  });

  // دائرة السلوك
  const allBeh=Object.values(A.behavior).flat();
  const pos=allBeh.filter(e=>e.type==='positive').length;
  const neg=allBeh.filter(e=>e.type==='negative').length;
  const neu=allBeh.filter(e=>e.type==='neutral').length;
  const behCtx=document.getElementById('behPieChart');
  if(behCtx&&(pos||neg||neu)) new Chart(behCtx,{
    type:'doughnut',
    data:{labels:['إيجابي','سلبي','محايد'],datasets:[{data:[pos,neg,neu],backgroundColor:['#10b981','#ef4444','#f59e0b'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:'Tajawal'}}}}}
  });
}

function printReport() {
  window.print();
}
window.printReport = printReport;
</script>
</body>
</html>
