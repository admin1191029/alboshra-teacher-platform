<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صور الطلاب — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
.photo-card {
  background:var(--card); backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:var(--r);
  padding:16px 10px; text-align:center; box-shadow:var(--shadow-sm);
  transition:all 0.18s; cursor:pointer;
}
.photo-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.photo-avatar {
  width:70px; height:70px; border-radius:50%; margin:0 auto 10px;
  background:linear-gradient(135deg,var(--sky),var(--plum));
  color:white; font-size:1.8rem; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; border:3px solid rgba(255,255,255,0.6);
  box-shadow:0 4px 16px rgba(21,101,192,0.25);
}
.photo-avatar img { width:100%; height:100%; object-fit:cover; }
.photo-name { font-size:0.82rem; font-weight:800; color:var(--ink2); margin-bottom:6px; }
.photo-btn  { font-size:0.72rem; color:var(--sky); cursor:pointer; background:none; border:none; font-family:'Tajawal',sans-serif; font-weight:700; }
.photo-btn:hover { text-decoration:underline; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'photos';
initApp({ sections:['students'], onReady: renderPhotos });

function renderPhotos() {
  const A = window.APP;
  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">📷 صور الطلاب</span></div>
    <div class="ph">
      <div><div class="ph-title">📷 صور الطلاب</div><div class="ph-sub">أضف صورة لكل طالب — تُحفظ مع بيانات الفصل</div></div>
      <div style="display:flex;gap:8px;">
        <span style="font-size:0.80rem;color:var(--muted);align-self:center;">الصور ≤ 200KB لكل طالب</span>
      </div>
    </div>
    ${!A.students.length
      ? '<div style="text-align:center;padding:60px;color:var(--muted);">أضف طلاباً أولاً من صفحة الطلاب</div>'
      : `<div class="photo-grid" id="photoGrid"></div>`}
  `;
  if (A.students.length) renderGrid();
}

function renderGrid() {
  const A = window.APP;
  document.getElementById('photoGrid').innerHTML = A.students.map((s,i) => {
    const nm = s.name || s.n || 'طالب';
    const photo = s.photo || '';
    return `<div class="photo-card" onclick="uploadPhoto('${s.id}')">
      <div class="photo-avatar" id="pa_${s.id}">
        ${photo ? `<img src="${esc(photo)}" alt="${esc(nm)}">` : nm.charAt(0)}
      </div>
      <div class="photo-name">${esc(nm.split(' ').slice(0,2).join(' '))}</div>
      <button class="photo-btn">${photo ? '🔄 تغيير الصورة' : '📷 إضافة صورة'}</button>
      ${photo ? `<br><button class="photo-btn" style="color:#ef4444;" onclick="removePhoto(event,'${s.id}')">✕ حذف</button>` : ''}
    </div>`;
  }).join('');
}

function uploadPhoto(sid) {
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 200*1024) { toast('الصورة أكبر من 200KB — اختر صورة أصغر أو قلّل جودتها', 'warning', 4000); return; }
    const reader = new FileReader();
    reader.onload = async ev => {
      const A = window.APP;
      const s = A.students.find(x=>x.id===sid);
      if (!s) return;
      s.photo = ev.target.result;
      const avatarEl = document.getElementById(`pa_${sid}`);
      if (avatarEl) avatarEl.innerHTML = `<img src="${s.photo}" alt="">`;
      await saveSection('students');
      renderGrid();
      toast('✅ تم حفظ الصورة', 'success');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function removePhoto(event, sid) {
  event.stopPropagation();
  const A = window.APP;
  const s = A.students.find(x=>x.id===sid);
  if (!s) return;
  delete s.photo;
  await saveSection('students');
  renderGrid();
  toast('تم حذف الصورة', 'info');
}

window.uploadPhoto=uploadPhoto; window.removePhoto=removePhoto;
</script>
</body>
</html>
