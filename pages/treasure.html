<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة الكنز — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.treasure-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.treasure-card {
  background:var(--card); backdrop-filter:var(--glass-blur);
  border:2px solid var(--glass-border); border-radius:var(--r);
  padding:18px 14px; text-align:center; box-shadow:var(--shadow-sm);
  transition:all 0.2s; position:relative;
}
.treasure-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.tc-rank { position:absolute; top:8px; right:10px; font-size:1.1rem; }
.tc-avatar {
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(135deg,var(--sky),var(--plum));
  color:white; font-size:1.4rem; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 8px; box-shadow:0 4px 12px rgba(21,101,192,0.3);
}
.tc-name  { font-size:0.82rem; font-weight:800; color:var(--ink2); margin-bottom:6px; }
.tc-coins { font-size:1.3rem; font-weight:900; color:#d97706; }
.tc-coins span { font-size:0.75rem; color:var(--muted); font-weight:400; }
.tc-btns  { display:flex; gap:6px; justify-content:center; margin-top:8px; }
.tc-btn { width:30px; height:28px; border-radius:8px; border:none; cursor:pointer; font-size:0.9rem; font-weight:800; transition:all 0.15s; }
.tc-btn.add { background:rgba(16,185,129,0.18); color:#059669; }
.tc-btn.add:hover { background:#10b981; color:white; }
.tc-btn.sub { background:rgba(239,68,68,0.15); color:#dc2626; }
.tc-btn.sub:hover { background:#ef4444; color:white; }
.top3 { border-color:#f59e0b; background:rgba(245,158,11,0.06); }
.top1 { border-color:#f59e0b; background:rgba(245,158,11,0.10); box-shadow:0 4px 20px rgba(245,158,11,0.25); }
.award-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface); border-radius:10px; margin-bottom:8px; font-size:0.84rem; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'treasure';
initApp({ sections:['students','treasure'], onReady: renderTreasure });

function renderTreasure() {
  const A = window.APP;
  if (!A.treasure) A.treasure = {};
  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">🗺️ خريطة الكنز</span></div>
    <div class="ph">
      <div><div class="ph-title">🗺️ خريطة الكنز</div><div class="ph-sub">نظام المكافآت والتشجيع — امنح الطلاب عملات الكنز!</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="awardAll(1)">🎁 +1 للكل</button>
        <button class="btn btn-ghost btn-sm" onclick="resetAll()">🔄 تصفير</button>
        <button class="btn btn-primary btn-sm" onclick="saveTreasure()">💾 حفظ</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start;flex-wrap:wrap;">
      <div>
        <div style="font-size:0.85rem;font-weight:700;color:var(--muted);margin-bottom:12px;">اضغط + أو − على بطاقة الطالب لإضافة أو خصم عملات 🪙</div>
        <div class="treasure-grid" id="treasureGrid"></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>🏆 لوحة الشرف</h3></div>
        <div class="card-body" id="leaderboard"></div>
      </div>
    </div>
  `;
  renderGrid();
}

function getCoins(sid) { return window.APP.treasure[sid] || 0; }

function renderGrid() {
  const A = window.APP;
  const sorted = [...A.students].sort((a,b)=>getCoins(b.id)-getCoins(a.id));
  const grid = document.getElementById('treasureGrid');
  if (!grid) return;
  grid.innerHTML = sorted.map((s,i) => {
    const nm = s.name||s.n||'طالب';
    const coins = getCoins(s.id);
    const rank = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    const cardClass = i===0&&coins>0?'top1':i<3&&coins>0?'top3':'';
    return `<div class="treasure-card ${cardClass}">
      <div class="tc-rank">${rank}</div>
      <div class="tc-avatar">${nm.charAt(0)}</div>
      <div class="tc-name">${esc(nm.split(' ')[0])}</div>
      <div class="tc-coins">🪙 ${coins} <span>عملة</span></div>
      <div class="tc-btns">
        <button class="tc-btn add" onclick="addCoins('${s.id}',5)">+5</button>
        <button class="tc-btn add" onclick="addCoins('${s.id}',1)">+1</button>
        <button class="tc-btn sub" onclick="addCoins('${s.id}',-1)">−1</button>
      </div>
    </div>`;
  }).join('');
  renderLeaderboard(sorted);
}

function addCoins(sid, n) {
  const A = window.APP;
  A.treasure[sid] = Math.max(0, (A.treasure[sid]||0) + n);
  renderGrid();
}

function renderLeaderboard(sorted) {
  const lb = document.getElementById('leaderboard');
  if (!lb) return;
  const top = sorted.filter(s=>getCoins(s.id)>0).slice(0,10);
  if (!top.length) { lb.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);">لا توجد عملات بعد</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  lb.innerHTML = top.map((s,i) => {
    const nm = s.name||s.n||'طالب';
    return `<div class="award-row">
      <span style="font-size:1.1rem;">${medals[i]||'🏅'}</span>
      <div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--plum));color:white;font-size:0.75rem;font-weight:900;display:flex;align-items:center;justify-content:center;">${nm.charAt(0)}</div>
      <span style="flex:1;font-weight:700;">${esc(nm.split(' ')[0])}</span>
      <span style="font-weight:900;color:#d97706;">🪙 ${getCoins(s.id)}</span>
    </div>`;
  }).join('');
}

function awardAll(n) {
  window.APP.students.forEach(s => addCoins(s.id, n));
  toast(`+${n} عملة للجميع 🎉`, 'success');
}

function resetAll() {
  if (!confirm('تصفير كل العملات؟')) return;
  window.APP.students.forEach(s => { window.APP.treasure[s.id] = 0; });
  renderGrid();
  toast('تم التصفير', 'info');
}

async function saveTreasure() {
  await saveSection('treasure');
  toast('✅ تم حفظ عملات الكنز', 'success');
}

window.addCoins=addCoins; window.awardAll=awardAll; window.resetAll=resetAll; window.saveTreasure=saveTreasure;
</script>
</body>
</html>
