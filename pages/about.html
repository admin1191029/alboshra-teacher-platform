<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حول التطبيق — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.about-hero { background:linear-gradient(135deg,rgba(21,101,192,0.12),rgba(124,58,237,0.08)); border:1px solid var(--glass-border); border-radius:var(--r); padding:36px 32px; text-align:center; margin-bottom:20px; box-shadow:var(--shadow-sm); }
.about-logo { font-family:'Amiri',serif; font-size:2.6rem; font-weight:700; color:var(--ink2); margin-bottom:8px; }
.about-logo span { color:#d97706; }
.about-version { display:inline-block; padding:4px 14px; background:var(--accent-soft); border-radius:99px; font-size:0.80rem; font-weight:800; color:var(--sky); margin-bottom:16px; }
.feature-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border); }
.feature-row:last-child { border-bottom:none; }
.feat-icon-big { width:40px; height:40px; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'about';
initApp({ sections:[], onReady: renderAbout });

function renderAbout() {
  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">💙 حول التطبيق</span></div>

    <div class="about-hero">
      <div class="about-logo">مدارس <span>البشرى</span></div>
      <div style="font-size:0.92rem;color:var(--muted);margin-bottom:12px;">منصة المعلم الذكية</div>
      <div class="about-version">الإصدار 2.0</div>
      <p style="font-size:0.88rem;color:var(--ink);max-width:500px;margin:0 auto;line-height:1.7;">
        منصة متكاملة لإدارة الفصل الدراسي — تُمكّن المعلم من متابعة الطلاب، تسجيل الحضور، إدارة الدرجات، وتقييم السلوك في مكان واحد محفوظ على السحابة.
      </p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

      <div class="card">
        <div class="card-header"><h3>✨ المميزات الرئيسية</h3></div>
        <div class="card-body">
          ${[
            ['🖥️','وضع الحصة التفاعلي','مؤقت، اختيار عشوائي، تسجيل حضور فوري'],
            ['👥','إدارة الطلاب','إضافة وتعديل وحذف مع صور ومعلومات تفصيلية'],
            ['📅','الحضور اليومي','تسجيل حضور/غياب/تأخر مع تقارير شاملة'],
            ['📒','دفتر الدرجات','أعمدة مرنة مع حساب المجاميع والتصدير'],
            ['⭐','تقييم السلوك','نقاط ونجوم مع لوحة الشرف'],
            ['🗺️','خريطة الكنز','نظام مكافآت تحفيزي للطلاب'],
            ['🎮','بنك الأسئلة','أسئلة متعددة الخيارات مع وضع الاختبار'],
            ['🤖','رؤى ذكية','تحليل تلقائي لبيانات الفصل'],
          ].map(([icon,title,sub])=>`
            <div class="feature-row">
              <div class="feat-icon-big">${icon}</div>
              <div><div style="font-weight:800;font-size:0.88rem;color:var(--ink2);">${title}</div><div style="font-size:0.76rem;color:var(--muted);">${sub}</div></div>
            </div>`).join('')}
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-header"><h3>☁️ التقنيات المستخدمة</h3></div>
          <div class="card-body">
            ${[
              ['🔥','Firebase Authentication','تسجيل الدخول بـ Google أو بريد إلكتروني'],
              ['🗄️','Cloud Firestore','قاعدة بيانات سحابية لكل معلم'],
              ['🌐','GitHub Pages','استضافة مجانية وسريعة'],
              ['🎨','CSS Glass Morphism','تصميم عصري وجميل'],
            ].map(([icon,title,sub])=>`
              <div class="feature-row">
                <div class="feat-icon-big">${icon}</div>
                <div><div style="font-weight:800;font-size:0.85rem;">${title}</div><div style="font-size:0.74rem;color:var(--muted);">${sub}</div></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>📋 معلومات</h3></div>
          <div class="card-body">
            <div style="display:flex;flex-direction:column;gap:10px;font-size:0.84rem;">
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                <span style="color:var(--muted);">الإصدار</span><strong>2.0.0</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                <span style="color:var(--muted);">المنصة</span><strong>Web (PWA)</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
                <span style="color:var(--muted);">اللغة</span><strong>العربية</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:6px 0;">
                <span style="color:var(--muted);">الترخيص</span><strong>للاستخدام التعليمي</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
