<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطلاب — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.students-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
.stu-card { background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;transition:all 0.2s;box-shadow:var(--shadow-sm); }
.stu-card:hover { transform:translateY(-2px);box-shadow:var(--shadow); }
.stu-actions { display:flex;gap:6px;margin-top:8px; }
.stu-detail  { font-size:0.78rem;color:var(--muted); }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>

<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>

<!-- Modal: إضافة/تعديل طالب -->
<div class="modal-overlay" id="stuModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="stuModalTitle">➕ إضافة طالب</h3>
      <button class="modal-close" onclick="closeModal('stuModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="stuId" />
      <div class="form-grid">
        <div class="fg" style="grid-column:1/-1;">
          <label>الاسم الكامل *</label>
          <input type="text" id="stuName" placeholder="اسم الطالب" />
        </div>
        <div class="fg">
          <label>الجنس</label>
          <select id="stuGender">
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </div>
        <div class="fg">
          <label>رقم الجلوس</label>
          <input type="text" id="stuNum" placeholder="اختياري" />
        </div>
        <div class="fg">
          <label>رقم ولي الأمر</label>
          <input type="tel" id="stuPhone" placeholder="05xxxxxxxx" dir="ltr" />
        </div>
        <div class="fg">
          <label>البريد الإلكتروني</label>
          <input type="email" id="stuEmail" placeholder="اختياري" dir="ltr" />
        </div>
        <div class="fg" style="grid-column:1/-1;">
          <label>ملاحظات</label>
          <textarea id="stuNotes" placeholder="أي ملاحظات عن الطالب..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveStu()">💾 حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal('stuModal')">إلغاء</button>
    </div>
  </div>
</div>

<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'students';

initApp({ sections:['students'], onReady: renderStudents });

function renderStudents() {
  const A = window.APP;
  const list = A.students;
  const nbEl = document.getElementById('nb-students');
  if (nbEl) { nbEl.textContent = list.length; nbEl.style.display = list.length ? '' : 'none'; }

  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">👥 الطلاب</span></div>
    <div class="ph">
      <div>
        <div class="ph-title">👥 الطلاب</div>
        <div class="ph-sub">${list.length} طالب في ${esc(A.activeClassName)}</div>
      </div>
      <div class="ph-actions">
        <button class="btn btn-primary" onclick="openAddStu()">➕ إضافة طالب</button>
        <button class="btn btn-ghost" onclick="importStudents()">📥 استيراد Excel</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi blue"><span class="kpi-icon">👥</span><div class="kpi-val">${list.length}</div><div class="kpi-label">إجمالي الطلاب</div></div>
      <div class="kpi blue"><span class="kpi-icon">👦</span><div class="kpi-val">${list.filter(s=>s.gender==='ذكر').length}</div><div class="kpi-label">ذكور</div></div>
      <div class="kpi plum"><span class="kpi-icon">👧</span><div class="kpi-val">${list.filter(s=>s.gender==='أنثى').length}</div><div class="kpi-label">إناث</div></div>
    </div>

    <!-- بحث -->
    <div class="card" style="margin-bottom:18px;">
      <div class="card-body" style="padding:12px 16px;">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <div class="search-box" style="flex:1;min-width:200px;">
            <input type="text" id="stuSearch" placeholder="ابحث عن طالب..." oninput="filterStudents(this.value)" />
          </div>
          <select id="stuGenderFilter" onchange="filterStudents()" style="padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);font-family:'Tajawal',sans-serif;font-size:0.88rem;">
            <option value="">الكل</option>
            <option value="ذكر">ذكور</option>
            <option value="أنثى">إناث</option>
          </select>
        </div>
      </div>
    </div>

    <!-- قائمة الطلاب -->
    <div id="stuGrid">
      ${renderStuGrid(list)}
    </div>
  `;
}

function renderStuGrid(list) {
  if (!list.length) return `
    <div class="empty-state">
      <div class="es-icon">👥</div>
      <div class="es-title">لا يوجد طلاب</div>
      <div class="es-sub">ابدأ بإضافة طلابك في هذا الفصل</div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="openAddStu()">➕ إضافة أول طالب</button>
    </div>`;

  return `<div class="students-grid">
    ${list.map((s,i)=>`
      <div class="stu-card">
        <div class="stu-avatar" style="width:46px;height:46px;border-radius:50%;flex-shrink:0;
             background:linear-gradient(135deg,${s.gender==='أنثى'?'#f43f5e,#7c3aed':'#1565c0,#7c3aed'});
             display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:1rem;">
          ${s.photo ? `<img src="${esc(s.photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />` : (s.name||'؟').charAt(0)}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="stu-name" style="font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name)}</div>
          <div class="stu-detail">${s.gender||''} ${s.num?'· #'+s.num:''}</div>
          ${s.phone?`<div class="stu-detail">📞 ${esc(s.phone)}</div>`:''}
          <div class="stu-actions">
            <button class="btn btn-ghost btn-xs" onclick="editStu('${s.id}')">✏️</button>
            <button class="btn btn-danger btn-xs" onclick="deleteStu('${s.id}')">🗑️</button>
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function filterStudents(q) {
  const A = window.APP;
  const query  = (q ?? document.getElementById('stuSearch')?.value ?? '').toLowerCase();
  const gender = document.getElementById('stuGenderFilter')?.value || '';
  const list = A.students.filter(s =>
    (!query || s.name?.toLowerCase().includes(query)) &&
    (!gender || s.gender === gender)
  );
  document.getElementById('stuGrid').innerHTML = renderStuGrid(list);
}
window.filterStudents = filterStudents;

function openAddStu() {
  document.getElementById('stuModalTitle').textContent = '➕ إضافة طالب';
  document.getElementById('stuId').value    = '';
  document.getElementById('stuName').value  = '';
  document.getElementById('stuNum').value   = '';
  document.getElementById('stuPhone').value = '';
  document.getElementById('stuEmail').value = '';
  document.getElementById('stuNotes').value = '';
  document.getElementById('stuGender').value= 'ذكر';
  openModal('stuModal');
}
window.openAddStu = openAddStu;

function editStu(id) {
  const s = APP.students.find(s=>s.id===id);
  if (!s) return;
  document.getElementById('stuModalTitle').textContent = '✏️ تعديل بيانات الطالب';
  document.getElementById('stuId').value    = id;
  document.getElementById('stuName').value  = s.name  || '';
  document.getElementById('stuNum').value   = s.num   || '';
  document.getElementById('stuPhone').value = s.phone || '';
  document.getElementById('stuEmail').value = s.email || '';
  document.getElementById('stuNotes').value = s.notes || '';
  document.getElementById('stuGender').value= s.gender|| 'ذكر';
  openModal('stuModal');
}
window.editStu = editStu;

async function saveStu() {
  const id   = document.getElementById('stuId').value;
  const name = document.getElementById('stuName').value.trim();
  if (!name) { toast('أدخل اسم الطالب', 'warning'); return; }

  const data = {
    id:     id || genId('stu'),
    name,
    gender: document.getElementById('stuGender').value,
    num:    document.getElementById('stuNum').value.trim(),
    phone:  document.getElementById('stuPhone').value.trim(),
    email:  document.getElementById('stuEmail').value.trim(),
    notes:  document.getElementById('stuNotes').value.trim(),
    photo:  '',
    createdAt: id ? undefined : new Date().toISOString(),
  };

  if (id) {
    const idx = APP.students.findIndex(s=>s.id===id);
    if (idx>=0) APP.students[idx] = { ...APP.students[idx], ...data };
  } else {
    APP.students.push(data);
  }

  const ok = await saveSection('students');
  if (ok !== false) {
    toast(id ? 'تم تعديل بيانات الطالب' : 'تمت إضافة الطالب', 'success');
    closeModal('stuModal');
    renderStudents();
  } else {
    toast('حدث خطأ في الحفظ', 'error');
  }
}
window.saveStu = saveStu;

function deleteStu(id) {
  const s = APP.students.find(s=>s.id===id);
  confirm2(`حذف الطالب "${s?.name}"؟ لا يمكن التراجع.`, async ()=>{
    APP.students = APP.students.filter(s=>s.id!==id);
    await saveSection('students');
    toast('تم حذف الطالب', 'success');
    renderStudents();
  });
}
window.deleteStu = deleteStu;

function importStudents() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.txt,.csv';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const added = [];
    lines.forEach(line => {
      const name = line.replace(/^\d+[\.\-\s]+/,'').trim();
      if (name) added.push({ id:genId('stu'), name, gender:'ذكر', num:'', phone:'', email:'', notes:'', photo:'', createdAt:new Date().toISOString() });
    });
    if (!added.length) { toast('لم يُعثر على أسماء', 'warning'); return; }
    APP.students.push(...added);
    await saveSection('students');
    toast(`تمت إضافة ${added.length} طالب`, 'success');
    renderStudents();
  };
  input.click();
}
window.importStudents = importStudents;
</script>
</body>
</html>
