<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقارنة الفصول — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.compare-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
.compare-table th { background:var(--accent-soft); color:var(--ink2); font-weight:800; padding:12px 16px; text-align:right; border-bottom:2px solid var(--border); }
.compare-table td { padding:11px 16px; border-bottom:1px solid var(--border); }
.compare-table tr:hover td { background:var(--accent-soft); }
.metric-bar-wrap { display:inline-block; width:80px; height:8px; background:var(--surface); border-radius:99px; overflow:hidden; vertical-align:middle; margin-left:6px; }
.metric-bar { height:100%; border-radius:99px; }
.active-class-row td { background:rgba(21,101,192,0.06) !important; font-weight:800; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'compare';
initApp({ sections:['students','attendance'], onReady: renderCompare });

async function renderCompare() {
  const A = window.APP;
  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">📊 مقارنة الفصول</span></div>
    <div class="ph"><div><div class="ph-title">📊 مقارنة الفصول</div><div class="ph-sub">مقارنة إحصائيات بين فصولك الدراسية</div></div>
    <button class="btn btn-primary btn-sm" onclick="openClassManager()">➕ إضافة فصل</button>
    </div>
    <div id="compareBody"><div class="loading-wrap"><div class="spinner"></div></div></div>
  `;

  if (A.classes.length < 2) {
    document.getElementById('compareBody').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:3rem;margin-bottom:14px;">📊</div>
        <div style="font-size:1rem;font-weight:800;color:var(--ink2);margin-bottom:8px;">لديك فصل واحد فقط حالياً</div>
        <div style="font-size:0.85rem;color:var(--muted);margin-bottom:20px;">أضف فصلاً ثانياً لتتمكن من المقارنة بين الفصول</div>
        <button class="btn btn-primary" onclick="openClassManager()">➕ إضافة فصل جديد</button>
      </div>`;
    return;
  }

  // Load data for all classes
  const classStats = await Promise.all(A.classes.map(async cls => {
    try {
      const students  = await DB.loadSection(A.uid, cls.id, 'students',  []);
      const attendance= await DB.loadSection(A.uid, cls.id, 'attendance',{});
      const attDays   = Object.keys(attendance).filter(k=>!k.includes('_'));
      let totalPresent=0, totalAtt=0;
      attDays.forEach(d => {
        (students||[]).forEach(s => {
          const st=attendance[d]?.[s.id];
          if(st!=='absent') totalPresent++; totalAtt++;
        });
      });
      const attPct = totalAtt ? Math.round((totalPresent/totalAtt)*100) : 0;
      return { id:cls.id, name:cls.name, studentCount:(students||[]).length, attDays:attDays.length, attPct, isActive:cls.id===A.activeClassId };
    } catch(e) { return { id:cls.id, name:cls.name, studentCount:0, attDays:0, attPct:0, isActive:cls.id===A.activeClassId }; }
  }));

  document.getElementById('compareBody').innerHTML = `
    <div class="card" style="padding:0;overflow:auto;">
      <table class="compare-table">
        <thead>
          <tr>
            <th>الفصل</th>
            <th>عدد الطلاب</th>
            <th>أيام الدراسة</th>
            <th>متوسط الحضور</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody>
          ${classStats.map(c => {
            const barColor = c.attPct>=80?'#10b981':c.attPct>=60?'#f59e0b':'#ef4444';
            return `<tr class="${c.isActive?'active-class-row':''}">
              <td>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:1rem;">🏫</span>
                  <span>${esc(c.name)}</span>
                  ${c.isActive?'<span class="badge badge-blue" style="font-size:0.68rem;">نشط</span>':''}
                </div>
              </td>
              <td><strong>${c.studentCount}</strong> طالب</td>
              <td>${c.attDays} يوم</td>
              <td>
                <div class="metric-bar-wrap"><div class="metric-bar" style="width:${c.attPct}%;background:${barColor};"></div></div>
                <span style="font-weight:800;color:${barColor};">${c.attDays?c.attPct+'%':'—'}</span>
              </td>
              <td>
                <button class="btn btn-ghost btn-sm" onclick="switchClass('${c.id}')">
                  ${c.isActive?'✓ الفصل الحالي':'تبديل إليه'}
                </button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px;">
      ${classStats.map(c=>`
        <div class="kpi-card" style="${c.isActive?'border:2px solid var(--sky);':''}" onclick="switchClass('${c.id}')" style="cursor:pointer;">
          <div class="kpi-icon">🏫</div>
          <div class="kpi-val" style="font-size:1.1rem;">${esc(c.name)}</div>
          <div class="kpi-label">${c.studentCount} طالب • ${c.attDays?c.attPct+'% حضور':'لا بيانات'}</div>
        </div>`).join('')}
    </div>
  `;
}
</script>
</body>
</html>
