<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة المقاعد — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.seat-layout { display: flex; gap: 20px; flex-wrap: wrap; }
.seat-panel {
  flex: 1; min-width: 280px;
  background: var(--card); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border); border-radius: var(--r);
  padding: 20px; box-shadow: var(--shadow-sm);
}
.seat-panel h3 { font-size: 0.95rem; font-weight: 800; color: var(--ink2); margin-bottom: 14px; }

/* Classroom grid */
.classroom-area {
  background: linear-gradient(180deg, rgba(21,101,192,0.04), transparent);
  border: 2px dashed var(--border2); border-radius: 14px;
  padding: 16px; min-height: 300px;
}
.board-label {
  text-align: center; font-size: 0.78rem; color: var(--muted);
  padding: 6px; background: var(--accent-soft);
  border-radius: 8px; margin-bottom: 16px; letter-spacing: 1px;
}
.seats-grid {
  display: grid; gap: 8px;
  grid-template-columns: repeat(var(--cols, 5), 1fr);
}
.seat {
  min-height: 56px; border-radius: 10px; border: 2px dashed rgba(21,101,192,0.25);
  background: rgba(255,255,255,0.5); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.18s; font-size: 0.72rem; text-align: center;
  padding: 4px; position: relative;
}
.seat.occupied {
  background: rgba(21,101,192,0.10); border-color: var(--sky);
  border-style: solid;
}
.seat.occupied:hover { background: rgba(239,68,68,0.10); border-color: var(--ember); }
.seat.drop-target { background: rgba(21,101,192,0.18); border-color: var(--sky); }
.seat .seat-num { position:absolute; top:3px; right:5px; font-size:0.60rem; color:var(--muted2); }
.seat .seat-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sky), var(--plum));
  color: white; font-size: 0.85rem; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 2px;
}
.seat .seat-name { font-size: 0.68rem; font-weight: 700; color: var(--ink2); line-height: 1.2; }
.seat.empty-icon { color: var(--muted2); font-size: 1.2rem; }

/* Student list */
.unassigned-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
.student-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 10px;
  cursor: pointer; transition: all 0.15s; font-size: 0.84rem; font-weight: 700;
}
.student-chip:hover { border-color: var(--sky); background: var(--accent-soft); }
.student-chip.selected { border-color: var(--sky); background: var(--accent-soft); box-shadow: 0 0 0 2px rgba(21,101,192,0.2); }
.student-chip.placed { opacity: 0.4; pointer-events: none; text-decoration: line-through; }
.chip-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--sky), var(--plum));
  color: white; font-size: 0.78rem; font-weight: 900;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* Layout controls */
.layout-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'seatmap';
let selectedStudentId = null;
let cols = 5, rows = 6;
// seatLayout: array of { seatIdx, studentId }
initApp({ sections: ['students','seatLayout'], onReady: renderSeatmap });

function renderSeatmap() {
  const A = window.APP;
  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">🪑 خريطة المقاعد</span></div>
    <div class="ph">
      <div><div class="ph-title">🪑 خريطة المقاعد</div><div class="ph-sub">رتّب مقاعد الطلاب واحفظ الترتيب</div></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑️ مسح الكل</button>
        <button class="btn btn-primary btn-sm" onclick="saveSeatmap()">💾 حفظ الترتيب</button>
      </div>
    </div>

    <div class="layout-controls card" style="padding:14px 18px;margin-bottom:16px;">
      <span style="font-size:0.85rem;font-weight:700;color:var(--ink2);">ضبط الشبكة:</span>
      <label style="font-size:0.82rem;color:var(--muted);">أعمدة</label>
      <input type="number" id="colsInp" value="${cols}" min="2" max="10" style="width:56px;padding:4px 6px;border:1px solid var(--border);border-radius:8px;font-family:inherit;"
        onchange="cols=+this.value;renderGridArea()">
      <label style="font-size:0.82rem;color:var(--muted);">صفوف</label>
      <input type="number" id="rowsInp" value="${rows}" min="2" max="10" style="width:56px;padding:4px 6px;border:1px solid var(--border);border-radius:8px;font-family:inherit;"
        onchange="rows=+this.value;renderGridArea()">
      <span style="font-size:0.78rem;color:var(--muted);">اختر طالباً من القائمة ثم اضغط على المقعد</span>
    </div>

    <div class="seat-layout">
      <div class="seat-panel" style="flex:2;">
        <h3>🏫 قاعة الدراسة</h3>
        <div class="classroom-area">
          <div class="board-label">📋 السبورة</div>
          <div class="seats-grid" id="seatsGrid" style="--cols:${cols};"></div>
        </div>
      </div>
      <div class="seat-panel" style="flex:1;">
        <h3>👥 الطلاب (${A.students.length})</h3>
        <div style="font-size:0.78rem;color:var(--muted);margin-bottom:10px;">اضغط على الطالب ثم اضغط على المقعد</div>
        <div class="unassigned-list" id="studentList"></div>
      </div>
    </div>
  `;
  renderGridArea();
  renderStudentList();
}

function renderGridArea() {
  const A = window.APP;
  const total = rows * cols;
  const grid = document.getElementById('seatsGrid');
  if (!grid) return;
  grid.style.setProperty('--cols', cols);
  const layout = A.seatLayout || [];
  grid.innerHTML = Array.from({length: total}, (_, i) => {
    const entry = layout.find(e => e.seatIdx === i);
    const student = entry ? A.students.find(s => s.id === entry.studentId) : null;
    if (student) {
      const nm = student.name || student.n || 'طالب';
      return `<div class="seat occupied" onclick="clickSeat(${i})" title="${esc(nm)}">
        <span class="seat-num">${i+1}</span>
        <div class="seat-avatar">${nm.charAt(0)}</div>
        <div class="seat-name">${esc(nm.split(' ')[0])}</div>
      </div>`;
    }
    return `<div class="seat empty-icon" onclick="clickSeat(${i})">
      <span class="seat-num">${i+1}</span>🪑
    </div>`;
  }).join('');
}

function renderStudentList() {
  const A = window.APP;
  const layout = A.seatLayout || [];
  const placedIds = layout.map(e => e.studentId);
  document.getElementById('studentList').innerHTML = A.students.map(s => {
    const nm = s.name || s.n || 'طالب';
    const placed = placedIds.includes(s.id);
    const sel = selectedStudentId === s.id;
    return `<div class="student-chip ${placed?'placed':''} ${sel?'selected':''}" onclick="selectStudent('${s.id}')" id="chip_${s.id}">
      <div class="chip-avatar">${nm.charAt(0)}</div>
      ${esc(nm)}
      ${placed ? ' ✓' : ''}
    </div>`;
  }).join('');
}

function selectStudent(sid) {
  selectedStudentId = sid === selectedStudentId ? null : sid;
  renderStudentList();
}

function clickSeat(seatIdx) {
  const A = window.APP;
  if (!A.seatLayout) A.seatLayout = [];
  const existing = A.seatLayout.find(e => e.seatIdx === seatIdx);
  if (existing) {
    // Remove from seat
    A.seatLayout = A.seatLayout.filter(e => e.seatIdx !== seatIdx);
    renderGridArea(); renderStudentList(); return;
  }
  if (!selectedStudentId) { toast('اختر طالباً أولاً من القائمة', 'info'); return; }
  // Remove student from previous seat if any
  A.seatLayout = A.seatLayout.filter(e => e.studentId !== selectedStudentId);
  A.seatLayout.push({ seatIdx, studentId: selectedStudentId });
  selectedStudentId = null;
  renderGridArea(); renderStudentList();
}

function clearAll() {
  if (!confirm('مسح ترتيب المقاعد؟')) return;
  window.APP.seatLayout = [];
  renderGridArea(); renderStudentList();
}

async function saveSeatmap() {
  await saveSection('seatLayout');
  toast('✅ تم حفظ ترتيب المقاعد', 'success');
}

window.selectStudent=selectStudent; window.clickSeat=clickSeat;
window.clearAll=clearAll; window.saveSeatmap=saveSeatmap;
</script>
</body>
</html>
