<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل التغييرات — مدارس البشرى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.timeline { position:relative; padding-right:28px; }
.timeline::before { content:''; position:absolute; top:0; bottom:0; right:10px; width:2px; background:var(--border); }
.tl-item { position:relative; margin-bottom:16px; }
.tl-dot { position:absolute; right:-22px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--sky); border:2px solid white; box-shadow:0 0 0 2px var(--sky); }
.tl-card { background:var(--card); backdrop-filter:var(--glass-blur); border:1px solid var(--glass-border); border-radius:12px; padding:12px 16px; box-shadow:var(--shadow-sm); }
.tl-date { font-size:0.72rem; color:var(--muted); margin-bottom:4px; }
.tl-action { font-size:0.86rem; font-weight:700; color:var(--ink2); }
.tl-detail { font-size:0.78rem; color:var(--muted); margin-top:3px; }
.type-add    .tl-dot { background:#10b981; box-shadow:0 0 0 2px #10b981; }
.type-edit   .tl-dot { background:#f59e0b; box-shadow:0 0 0 2px #f59e0b; }
.type-delete .tl-dot { background:#ef4444; box-shadow:0 0 0 2px #ef4444; }
</style>
</head>
<body>
<div id="appShell"></div>
<div id="toastContainer"></div>
<main class="main-content" id="mainContent">
  <div class="loading-wrap"><div class="spinner"></div></div>
</main>
<script type="module">import '../js/firebase.js';</script>
<script src="../js/shared.js"></script>
<script src="../js/shell.js"></script>
<script>
window.PAGE_ID = 'changelog';
initApp({ sections:['changelog'], onReady: renderChangelog });

function renderChangelog() {
  const A = window.APP;
  if (!A.changelog) A.changelog = [];

  // Add some system entries about app version
  const appLogs = [
    { id:'sys_1', type:'add', action:'تم إضافة وضع الحصة', detail:'وضع الحصة التفاعلي مع المؤقت والاختيار العشوائي', at: new Date().toISOString() },
    { id:'sys_2', type:'add', action:'تم إضافة خريطة الكنز', detail:'نظام المكافآت والتشجيع للطلاب', at: new Date(Date.now()-86400000).toISOString() },
    { id:'sys_3', type:'add', action:'تم إضافة بنك الأسئلة', detail:'إنشاء واختبار بنك أسئلة متعدد الخيارات', at: new Date(Date.now()-172800000).toISOString() },
    { id:'sys_4', type:'add', action:'تم إضافة تقرير الغياب', detail:'تقرير تفصيلي بنسب الحضور والغياب لكل طالب', at: new Date(Date.now()-259200000).toISOString() },
  ];

  const allLogs = [...A.changelog, ...appLogs].sort((a,b)=>new Date(b.at)-new Date(a.at));

  document.getElementById('mainContent').innerHTML = `
    <div class="breadcrumb">🏠 <a href="dashboard.html" style="color:inherit;text-decoration:none;">الرئيسية</a> <span class="sep">›</span> <span class="active">📜 سجل التغييرات</span></div>
    <div class="ph">
      <div><div class="ph-title">📜 سجل التغييرات</div><div class="ph-sub">${allLogs.length} إدخال مسجّل</div></div>
      <button class="btn btn-ghost btn-sm" onclick="clearLog()">🗑️ مسح سجل المعلم</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start;">
      <div>
        <div class="timeline" id="timelineEl">
          ${allLogs.length ? allLogs.map(log => `
            <div class="tl-item type-${log.type||'add'}">
              <div class="tl-dot"></div>
              <div class="tl-card">
                <div class="tl-date">${formatDate(log.at)}</div>
                <div class="tl-action">${typeIcon(log.type)} ${esc(log.action||'')}</div>
                ${log.detail?`<div class="tl-detail">${esc(log.detail)}</div>`:''}
              </div>
            </div>`).join('')
            : '<div style="text-align:center;padding:40px;color:var(--muted);">لا توجد سجلات بعد</div>'}
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>📊 ملخص</h3></div>
        <div class="card-body">
          ${[
            {label:'إجمالي الإدخالات', val:allLogs.length, icon:'📝'},
            {label:'إضافات', val:allLogs.filter(l=>l.type==='add').length, icon:'➕'},
            {label:'تعديلات', val:allLogs.filter(l=>l.type==='edit').length, icon:'✏️'},
            {label:'حذف', val:allLogs.filter(l=>l.type==='delete').length, icon:'🗑️'},
          ].map(item=>`
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
              <span>${item.icon}</span>
              <span style="flex:1;font-size:0.82rem;">${item.label}</span>
              <span style="font-weight:900;color:var(--sky);">${item.val}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function typeIcon(t) { return {add:'➕',edit:'✏️',delete:'🗑️'}[t]||'📝'; }

async function clearLog() {
  if (!confirm('مسح سجل التغييرات الخاص بك؟ (لن تُمسح سجلات النظام)')) return;
  window.APP.changelog = [];
  await saveSection('changelog');
  renderChangelog();
  toast('تم مسح السجل', 'info');
}
window.clearLog = clearLog;
</script>
</body>
</html>
